# Codecov configuration.
#
# Without this file Codecov applies its defaults, and the default patch status fails a PR
# whose diff contains no coverable lines — so documentation-only pull requests show a red
# codecov/patch (measured in m0nklabs/oelala: #236 docs-only = failure, #239 code = success).
# A check that is red for a correct reason teaches people to ignore red checks, so both
# statuses are informational and the paths that cannot be covered are ignored.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  # Prose only — docs/*.md carries no executable line.
  - "docs/**"
  # The suite itself is not the subject under test.
  - "tests/**"
  # Unlike m0nklabs/oelala, "scripts/**" is deliberately NOT ignored here: every module the
  # tests import lives in scripts/ (the tests put it on sys.path), so ignoring it would leave
  # Codecov with nothing to measure and turn the statuses into decoration.