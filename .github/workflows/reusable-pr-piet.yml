# ============================================================================
# PR-Piet — reusable workflow voor automatische PR-review met repo-context
# ----------------------------------------------------------------------------
# Org: m0nklabs | Runtime: The-PR-Agent/pr-agent via guardian-llmprovider-gateway
#
# Jobs:
#   1. map          — géén secrets: checkout PR-head, tree-sitter repo-map
#                     (scripts/repo_mapper.py) -> .pr_piet/context.md artifact
#   2. review_tier1 — deepseek-v4-flash-0731 review mét repo-context
#                     (artifact_path injectie). GEEN fallback: fout = rode run.
#   3. review_tier2 — OPTIONEEL: z-ai/glm-5.2 second opinion, alleen als
#                     tier 1 "No major issues detected" meldt.
#
# Aanroepen vanuit een doel-repo:
#   uses: m0nklabs/pr-piet/.github/workflows/reusable-pr-piet.yml@main
# Zie examples/caller-pr-piet.yml en README.md.
# ============================================================================

name: PR-Piet (reusable)

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull request nummer (github.event.pull_request.number || github.event.issue.number)"
        required: true
        type: number
      base_branch:
        description: "Basis-branch voor de diff. Leeg = repository default branch."
        required: false
        type: string
        default: ""
      pr_piet_repo:
        description: "Repo met scripts + config (default: deze repo)."
        required: false
        type: string
        default: "m0nklabs/pr-piet"
      pr_piet_ref:
        description: "Ref van pr-piet (scripts + config) om te gebruiken."
        required: false
        type: string
        default: "main"
      gateway_base_url:
        description: "OpenAI-compatibele base URL van de guardian gateway."
        required: false
        type: string
        default: "http://172.17.0.1:11434/v1"
      model_tier1:
        description: "Tier-1 model (open-weights, via gateway). Sinds 2026-08-30 glm-5.3-flash: E2E-bewezen 3/3 geplante bugs + formele review (pr-piet-test PR #9), natuurlijke stop-discipline (73 s, 3,9k out) i.v.m. deepseek's reasoning-ramp (131k provider-default burn, 39% dagverspilling)."
        required: false
        type: string
        default: "openai/z-ai/glm-5.3-flash"
      model_tier2:
        description: "Tier-2 second-opinion model."
        required: false
        type: string
        default: "openai/z-ai/glm-5.2"
      enable_tier2:
        description: "Tier 2 (second opinion) aan/uit."
        required: false
        type: boolean
        default: true
      auto_describe:
        description: "Draai /describe automatisch bij PR-opened events."
        required: false
        type: boolean
        default: true
      auto_improve:
        description: "Draai /improve automatisch bij PR-opened events."
        required: false
        type: boolean
        default: true
      single_call_review:
        description: "EXPERIMENTEEL: combineer /review + /improve in ÉÉN modelcall (standaard=false = oude 2-call gedrag). Zet deze op true om 1 call/PR te doen; /improve wordt dan niet apart gedraaid en suggesties komen uit de review-body. Makkelijk terug te draaien: zet weer op false."
        required: false
        type: boolean
        default: false
      response_language:
        description: "Taal van pr-agent output (ISO 639/3166, bijv. en-US of nl-NL)."
        required: false
        type: string
        default: "en-US"
      max_context_tokens:
        description: "Token-budget voor de repo-map context.md."
        required: false
        type: number
        default: 4096
      max_diff_bytes:
        description: "Max diff-grootte (bytes) die de mapper volledig parseert (tree-sitter); groter = diff-only summary. Sinds 2026-08-30 524288 (512 KB): full AST-path op een 214 KB productie-PR duurde 2,0 s en de token-truncatie is bewezen correct."
        required: false
        type: number
        default: 524288
    secrets:
      GUARDIAN_API_KEY:
        description: "Gateway API key voor pr-piet (org-secret)."
        required: true

# ---------------------------------------------------------------------------
# Job 1: map — repo-context bouwen zonder secrets
# ---------------------------------------------------------------------------
jobs:
  map:
    name: "Map PR context (tree-sitter)"
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || github.event.issue.pull_request }}
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # refs/pull/N/head werkt voor pull_request én issue_comment events.
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0

      - name: Clone pr-piet (scripts + config)
        run: |
          rm -rf pr-piet
          git clone --depth 1 --branch "${{ inputs.pr_piet_ref }}" \
            "https://github.com/${{ inputs.pr_piet_repo }}.git" pr-piet

      - name: Python + tree-sitter
        run: |
          python3 -m venv pr-piet/.venv
          pr-piet/.venv/bin/pip install --quiet --upgrade pip
          pr-piet/.venv/bin/pip install --quiet -r pr-piet/requirements.txt

      - name: Bouw repo-map
        env:
          BASE_REF: ${{ inputs.base_branch || github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          MAX_TOKENS: ${{ inputs.max_context_tokens }}
          MAX_DIFF_BYTES: ${{ inputs.max_diff_bytes }}
        run: |
          head_sha="${HEAD_SHA:-$(git rev-parse HEAD)}"
          echo "base=origin/${BASE_REF} head=${head_sha}"
          pr-piet/.venv/bin/python pr-piet/scripts/repo_mapper.py \
            --repo . \
            --base "origin/${BASE_REF}" \
            --head "${head_sha}" \
            --output .pr_piet/context.md \
            --max-tokens "${MAX_TOKENS}" \
            --max-diff-bytes "${MAX_DIFF_BYTES}" \
            --json

      - name: Upload context artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-piet-context
          path: .pr_piet/
          # .pr_piet/ is een hidden dir (punt-prefix); upload-artifact v4
          # slaat hidden files standaard over (include-hidden-files=false).
          include-hidden-files: true
          if-no-files-found: error

# ---------------------------------------------------------------------------
# Job 2: review tier 1 (deepseek) — geen fallback, fout = rode workflow
# ---------------------------------------------------------------------------
  review_tier1:
    name: "Review tier 1 (${{ inputs.model_tier1 }})"
    needs: [map]
    runs-on: [self-hosted, Linux]
    # 60 min: grote PRs (bv. +2800 regels) kunnen de review-call dicht bij de
    # ai_timeout (900s) brengen plus map-job/submit; 30 min was krap (advies
    # PR #12: diepe reviews op grote diffs liepen tegen de 30-min-jobcap).
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      tier1_clean: ${{ steps.detect.outputs.tier1_clean }}
    steps:
      - name: Skip als PR al gesloten/gemerged is
        id: pr-state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Een review op een al gesloten/gemergde PR is nutteloos (modeltijd
          # weggooien). Check de PR-state en markeer de job als skipped zodra
          # de PR niet meer open is. De rest van de job draait dan niet.
          state=$(gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}" \
            --jq '.state' 2>/dev/null || echo "?")
          state_reason=$(gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}" \
            --jq '.state_reason // ""' 2>/dev/null || echo "")
          echo "PR #${{ inputs.pr_number }} state=$state reason=$state_reason"
          if [ "$state" != "open" ]; then
            echo "::notice::PR #${{ inputs.pr_number }} is $state (gesloten/gemerged) — review overgeslagen"
            echo "closed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Start-tijdstip (voor tier-2 detectie van de verse comment)
        if: steps.pr-state.outputs.closed != 'true'
        id: ts
        run: echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Clone pr-piet (scripts + config)
        if: steps.pr-state.outputs.closed != 'true'
        run: |
          rm -rf pr-piet
          git clone --depth 1 --branch "${{ inputs.pr_piet_ref }}" \
            "https://github.com/${{ inputs.pr_piet_repo }}.git" pr-piet

      - name: Download repo-context
        if: steps.pr-state.outputs.closed != 'true'
        uses: actions/download-artifact@v4
        with:
          name: pr-piet-context
          path: .pr_piet/

      - name: Koppel PR-Piet config
        if: steps.pr-state.outputs.closed != 'true'
        run: |
          cp pr-piet/config/.pr_agent.toml .pr_piet/.pr_agent.toml
          ls -la .pr_piet/

      - name: PR Agent (tier 1)
        id: pr-agent
        if: steps.pr-state.outputs.closed != 'true'

        # FORK: m0nklabs/pr-agent = upstream The-PR-Agent/pr-agent + onze
        # suggested_fix-patch (zie PR-PIET-PATCH.md in die repo). Terugdraaien
        # naar upstream = deze regel terugzetten naar the-pr-agent/pr-agent@main.
        uses: m0nklabs/pr-agent@main
        with:
          artifact_path: .pr_piet/context.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Guardian gateway (OpenAI-compatibel). Key = org-secret.
          OPENAI_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          OPENAI.API_BASE: ${{ inputs.gateway_base_url }}
          # Onze config eerst. Let op: de action draait in een docker-container,
          # dus het pad is het CONTAINER-pad (/github/workspace), niet het
          # runner-pad. (repo-local .pr_agent.toml + env overriden dit.)
          PR_AGENT_EXTRA_CONFIG_URL: /github/workspace/.pr_piet/.pr_agent.toml
          # Modellen: open-weights, GEEN fallback.
          config.model: ${{ inputs.model_tier1 }}
          config.fallback_models: "[]"
          config.custom_model_max_tokens: "1048576"
          config.max_model_tokens: "64000"
          config.ai_timeout: "900"
          config.large_patch_policy: "clip"
          # Begrens de AGENTS.md-repo-context van doel-repos (sommige zijn
          # honderden KB); de PR-Piet repo-map is de primaire context.
          config.repo_context_max_lines: "300"
          config.response_language: ${{ inputs.response_language }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: ${{ inputs.auto_describe }}
          # In single-call-modus géén aparte /improve-call (de suggesties komen
          # dan uit de review zelf). Anders: de gevraagde auto_improve.
          github_action_config.auto_improve: ${{ inputs.single_call_review && 'false' || inputs.auto_improve }}
          # Single-call-modus: vraag per key-issue om een exacte suggested_fix
          # (onze pr-agent-fork-patch; default false = exact upstream-gedrag).
          # submit_review.py wikkelt die in ```suggestion```-fences (Apply-knop).
          pr_reviewer.require_suggested_fix: ${{ inputs.single_call_review }}
          # Re-review bij nieuwe pushes op een open PR (synchronize-event).
          # Zonder deze settings skipt pr-agent synchronize (staat niet in
          # pr_actions) → geen modelcall, en de submit-post valt terug op een
          # fallback-body van de vorige review (stale inhoud op nieuwe head).
          #
          # INCREMENTEEL (advies guardian-llmprovider-gateway PR #12: 34 full
          # reviews in 13 uur): een push reviewt alleen de commits sinds de
          # laatste gereviewde head (`-i`-vlag). De gate in de fork
          # (`_can_run_incremental_review`) valt netjes terug op een FULL
          # review als er nog geen review-marker op de PR is. Full review
          # blijft verder: de auto-review op opened en een menselijke /review.
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: ${{ inputs.single_call_review && '["/review -i"]' || '["/review -i", "/improve"]' }}
          # Schrijf de gestructureerde review-JSON naar de step-output, zodat
          # wij die kunnen omzetten naar een formele GitHub review (Copilot-look).
          github_action_config.enable_output: "true"
          # Harde regel 8: NOOIT auto-approve / auto-merge — altijd human merge.
          # Deze env-guards overrulen repo-local .pr_agent.toml.
          pr_code_suggestions.commutable_code_suggestions: "false"
          pr_code_suggestions.enable_auto_approve: "false"

      - name: Submit formele GitHub review (Copilot-stijl)
        id: submit
        if: steps.pr-state.outputs.closed != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEW_JSON: ${{ steps.pr-agent.outputs.review }}
          # Single-call-modus: suggesties halen uit de review-body i.p.v. uit
          # een aparte /improve-comment.
          PR_PIET_SINGLE_CALL: ${{ inputs.single_call_review }}
        run: |
          if [ -n "${REVIEW_JSON}" ]; then
            printf '%s' "${REVIEW_JSON}" > /tmp/pr-agent-review.json
            json_arg="--review-json /tmp/pr-agent-review.json"
          else
            echo "Geen review-JSON in step-output; fallback: body uit issue-comment"
            json_arg=""
          fi
          python3 pr-piet/scripts/submit_review.py \
            --pr-number "${{ inputs.pr_number }}" \
            --heading "PR Reviewer Guide" \
            --since "${{ steps.ts.outputs.since }}" \
            ${json_arg} \
            > /tmp/submit_review.out 2> /tmp/submit_review.err
          rc=$?
          cat /tmp/submit_review.out
          if [ -s /tmp/submit_review.err ]; then
            echo "--- stderr ---"
            cat /tmp/submit_review.err
          fi
          # Harde regel 2: een model-/gateway-fout (geen verse review-JSON en
          # geen verse review-comment => lege/afgekapte model-output) moet een
          # RODE workflow zijn, géén stille fallback van een verouderde review
          # (submit_review.py return 3). Overige exit-codes (bv. 1/2: een
          # GitHub API-fout op inline comments) blijven niet-fataal, zoals
          # voorheen (submit_review degradeert daar zelf naar review-zonder-
          # comments).
          if [ "$rc" -eq 3 ]; then
            echo "::error::PR-Piet: geen verse review (lege model-output); zie stderr"
            exit 1
          fi
          exit 0

      - name: Detecteer tier-1 resultaat (clean of findings)
        id: detect
        if: steps.pr-state.outputs.closed != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          clean=$(python3 pr-piet/scripts/detect_review_clean.py \
            "${{ inputs.pr_number }}" \
            "PR Reviewer Guide" \
            "${{ steps.ts.outputs.since }}")
          echo "tier1_clean=${clean}" >> "$GITHUB_OUTPUT"
          echo "tier1_clean=${clean}"

# ---------------------------------------------------------------------------
# Job 3: review tier 2 (GLM second opinion) — alleen bij schone tier 1
# ---------------------------------------------------------------------------
  review_tier2:
    name: "Review tier 2 (${{ inputs.model_tier2 }})"
    needs: [review_tier1]
    if: ${{ inputs.enable_tier2 && needs.review_tier1.outputs.tier1_clean == 'true' }}
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Clone pr-piet (scripts + config)
        run: |
          rm -rf pr-piet
          git clone --depth 1 --branch "${{ inputs.pr_piet_ref }}" \
            "https://github.com/${{ inputs.pr_piet_repo }}.git" pr-piet

      - name: Download repo-context
        uses: actions/download-artifact@v4
        with:
          name: pr-piet-context
          path: .pr_piet/

      - name: Koppel PR-Piet config
        run: |
          cp pr-piet/config/.pr_agent.toml .pr_piet/.pr_agent.toml

      - name: PR Agent (tier 2 — second opinion)

        # FORK: m0nklabs/pr-agent (zie tier 1).
        uses: m0nklabs/pr-agent@main
        with:
          artifact_path: .pr_piet/context.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          OPENAI.API_BASE: ${{ inputs.gateway_base_url }}
          PR_AGENT_EXTRA_CONFIG_URL: /github/workspace/.pr_piet/.pr_agent.toml
          config.model: ${{ inputs.model_tier2 }}
          config.fallback_models: "[]"
          config.custom_model_max_tokens: "131072"
          config.max_model_tokens: "64000"
          config.ai_timeout: "900"
          config.large_patch_policy: "clip"
          config.repo_context_max_lines: "300"
          config.response_language: ${{ inputs.response_language }}
          # Tier 2 is uitsluitend een review (second opinion).
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          # Ook tier 2 re-reviewt bij nieuwe pushes (zie tier 1-toelichting);
          # zonder push_trigger skipt de action synchronize volledig.
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/review"]'
