# ============================================================================
# PR-Piet — reusable workflow voor automatische PR-review met repo-context
# ----------------------------------------------------------------------------
# Org: m0nklabs | Runtime: The-PR-Agent/pr-agent via guardian-llmprovider-gateway
#
# Jobs:
#   1. map          — géén secrets: checkout PR-head, tree-sitter repo-map
#                     (scripts/repo_mapper.py) -> .pr_piet/context.md artifact
#   2. review_tier1 — deepseek-v4-flash-0731 review mét repo-context
#                     (artifact_path injectie). GEEN fallback: fout = rode run.
#   3. review_tier2 — OPTIONEEL: z-ai/glm-5.2 second opinion, alleen als
#                     tier 1 "No major issues detected" meldt.
#
# Aanroepen vanuit een doel-repo:
#   uses: m0nklabs/pr-piet/.github/workflows/reusable-pr-piet.yml@main
# Zie examples/caller-pr-piet.yml en README.md.
# ============================================================================

name: PR-Piet (reusable)

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull request nummer (github.event.pull_request.number || github.event.issue.number)"
        required: true
        type: number
      base_branch:
        description: "Basis-branch voor de diff. Leeg = repository default branch."
        required: false
        type: string
        default: ""
      pr_piet_repo:
        description: "Repo met scripts + config (default: deze repo)."
        required: false
        type: string
        default: "m0nklabs/pr-piet"
      pr_piet_ref:
        description: "Ref van pr-piet (scripts + config) om te gebruiken."
        required: false
        type: string
        default: "main"
      gateway_base_url:
        description: "OpenAI-compatibele base URL van de guardian gateway."
        required: false
        type: string
        default: "http://172.17.0.1:11434/v1"
      model_tier1:
        description: "Tier-1 model (open-weights, via gateway)."
        required: false
        type: string
        default: "openai/deepseek/deepseek-v4-flash-0731"
      model_tier2:
        description: "Tier-2 second-opinion model."
        required: false
        type: string
        default: "openai/z-ai/glm-5.2"
      enable_tier2:
        description: "Tier 2 (second opinion) aan/uit."
        required: false
        type: boolean
        default: true
      auto_describe:
        description: "Draai /describe automatisch bij PR-opened events."
        required: false
        type: boolean
        default: true
      auto_improve:
        description: "Draai /improve automatisch bij PR-opened events."
        required: false
        type: boolean
        default: true
      response_language:
        description: "Taal van pr-agent output (ISO 639/3166, bijv. en-US of nl-NL)."
        required: false
        type: string
        default: "en-US"
      max_context_tokens:
        description: "Token-budget voor de repo-map context.md."
        required: false
        type: number
        default: 4096
    secrets:
      GUARDIAN_API_KEY:
        description: "Gateway API key voor pr-piet (org-secret)."
        required: true

# ---------------------------------------------------------------------------
# Job 1: map — repo-context bouwen zonder secrets
# ---------------------------------------------------------------------------
jobs:
  map:
    name: "Map PR context (tree-sitter)"
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || github.event.issue.pull_request }}
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # refs/pull/N/head werkt voor pull_request én issue_comment events.
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0

      - name: Clone pr-piet (scripts + config)
        run: |
          rm -rf pr-piet
          git clone --depth 1 --branch "${{ inputs.pr_piet_ref }}" \
            "https://github.com/${{ inputs.pr_piet_repo }}.git" pr-piet

      - name: Python + tree-sitter
        run: |
          python3 -m venv pr-piet/.venv
          pr-piet/.venv/bin/pip install --quiet --upgrade pip
          pr-piet/.venv/bin/pip install --quiet -r pr-piet/requirements.txt

      - name: Bouw repo-map
        env:
          BASE_REF: ${{ inputs.base_branch || github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          MAX_TOKENS: ${{ inputs.max_context_tokens }}
        run: |
          head_sha="${HEAD_SHA:-$(git rev-parse HEAD)}"
          echo "base=origin/${BASE_REF} head=${head_sha}"
          pr-piet/.venv/bin/python pr-piet/scripts/repo_mapper.py \
            --repo . \
            --base "origin/${BASE_REF}" \
            --head "${head_sha}" \
            --output .pr_piet/context.md \
            --max-tokens "${MAX_TOKENS}" \
            --json

      - name: Upload context artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-piet-context
          path: .pr_piet/
          # .pr_piet/ is een hidden dir (punt-prefix); upload-artifact v4
          # slaat hidden files standaard over (include-hidden-files=false).
          include-hidden-files: true
          if-no-files-found: error

# ---------------------------------------------------------------------------
# Job 2: review tier 1 (deepseek) — geen fallback, fout = rode workflow
# ---------------------------------------------------------------------------
  review_tier1:
    name: "Review tier 1 (${{ inputs.model_tier1 }})"
    needs: [map]
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      tier1_clean: ${{ steps.detect.outputs.tier1_clean }}
    steps:
      - name: Start-tijdstip (voor tier-2 detectie van de verse comment)
        id: ts
        run: echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Clone pr-piet (scripts + config)
        run: |
          rm -rf pr-piet
          git clone --depth 1 --branch "${{ inputs.pr_piet_ref }}" \
            "https://github.com/${{ inputs.pr_piet_repo }}.git" pr-piet

      - name: Download repo-context
        uses: actions/download-artifact@v4
        with:
          name: pr-piet-context
          path: .pr_piet/

      - name: Koppel PR-Piet config
        run: |
          cp pr-piet/config/.pr_agent.toml .pr_piet/.pr_agent.toml
          ls -la .pr_piet/

      - name: PR Agent (tier 1)
        id: pr-agent

        uses: the-pr-agent/pr-agent@main
        with:
          artifact_path: .pr_piet/context.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Guardian gateway (OpenAI-compatibel). Key = org-secret.
          OPENAI_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          OPENAI.API_BASE: ${{ inputs.gateway_base_url }}
          # Onze config eerst. Let op: de action draait in een docker-container,
          # dus het pad is het CONTAINER-pad (/github/workspace), niet het
          # runner-pad. (repo-local .pr_agent.toml + env overriden dit.)
          PR_AGENT_EXTRA_CONFIG_URL: /github/workspace/.pr_piet/.pr_agent.toml
          # Modellen: open-weights, GEEN fallback.
          config.model: ${{ inputs.model_tier1 }}
          config.fallback_models: "[]"
          config.custom_model_max_tokens: "1048576"
          config.max_model_tokens: "64000"
          config.ai_timeout: "300"
          config.large_patch_policy: "clip"
          # Begrens de AGENTS.md-repo-context van doel-repos (sommige zijn
          # honderden KB); de PR-Piet repo-map is de primaire context.
          config.repo_context_max_lines: "300"
          config.response_language: ${{ inputs.response_language }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: ${{ inputs.auto_describe }}
          github_action_config.auto_improve: ${{ inputs.auto_improve }}
          # Schrijf de gestructureerde review-JSON naar de step-output, zodat
          # wij die kunnen omzetten naar een formele GitHub review (Copilot-look).
          github_action_config.enable_output: "true"
          # Harde regel 8: NOOIT auto-approve / auto-merge — altijd human merge.
          # Deze env-guards overrulen repo-local .pr_agent.toml.
          pr_code_suggestions.commutable_code_suggestions: "false"
          pr_code_suggestions.enable_auto_approve: "false"

      - name: Submit formele GitHub review (Copilot-stijl)
        id: submit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEW_JSON: ${{ steps.pr-agent.outputs.review }}
        run: |
          if [ -n "${REVIEW_JSON}" ]; then
            printf '%s' "${REVIEW_JSON}" > /tmp/pr-agent-review.json
            json_arg="--review-json /tmp/pr-agent-review.json"
          else
            echo "Geen review-JSON in step-output; fallback: body uit issue-comment"
            json_arg=""
          fi
          python3 pr-piet/scripts/submit_review.py \
            --pr-number "${{ inputs.pr_number }}" \
            --heading "PR Reviewer Guide" \
            --since "${{ steps.ts.outputs.since }}" \
            ${json_arg} \
            > /tmp/submit_review.out 2> /tmp/submit_review.err || true
          cat /tmp/submit_review.out
          if [ -s /tmp/submit_review.err ]; then
            echo "--- stderr ---"
            cat /tmp/submit_review.err
          fi

      - name: Detecteer tier-1 resultaat (clean of findings)
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          clean=$(python3 pr-piet/scripts/detect_review_clean.py \
            "${{ inputs.pr_number }}" \
            "PR Reviewer Guide" \
            "${{ steps.ts.outputs.since }}")
          echo "tier1_clean=${clean}" >> "$GITHUB_OUTPUT"
          echo "tier1_clean=${clean}"

# ---------------------------------------------------------------------------
# Job 3: review tier 2 (GLM second opinion) — alleen bij schone tier 1
# ---------------------------------------------------------------------------
  review_tier2:
    name: "Review tier 2 (${{ inputs.model_tier2 }})"
    needs: [review_tier1]
    if: ${{ inputs.enable_tier2 && needs.review_tier1.outputs.tier1_clean == 'true' }}
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Clone pr-piet (scripts + config)
        run: |
          rm -rf pr-piet
          git clone --depth 1 --branch "${{ inputs.pr_piet_ref }}" \
            "https://github.com/${{ inputs.pr_piet_repo }}.git" pr-piet

      - name: Download repo-context
        uses: actions/download-artifact@v4
        with:
          name: pr-piet-context
          path: .pr_piet/

      - name: Koppel PR-Piet config
        run: |
          cp pr-piet/config/.pr_agent.toml .pr_piet/.pr_agent.toml

      - name: PR Agent (tier 2 — second opinion)

        uses: the-pr-agent/pr-agent@main
        with:
          artifact_path: .pr_piet/context.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          OPENAI.API_BASE: ${{ inputs.gateway_base_url }}
          PR_AGENT_EXTRA_CONFIG_URL: /github/workspace/.pr_piet/.pr_agent.toml
          config.model: ${{ inputs.model_tier2 }}
          config.fallback_models: "[]"
          config.custom_model_max_tokens: "131072"
          config.max_model_tokens: "64000"
          config.ai_timeout: "300"
          config.large_patch_policy: "clip"
          config.repo_context_max_lines: "300"
          config.response_language: ${{ inputs.response_language }}
          # Tier 2 is uitsluitend een review (second opinion).
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
