# ============================================================================
# Tests — unittest suite in tests/, coverage over scripts/, upload to Codecov
# ----------------------------------------------------------------------------
# Public repo: Codecov accepts the upload tokenless (there is no CODECOV_TOKEN
# anywhere in the org), so the action is pinned by commit SHA instead of a tag
# — a scanner whose behaviour can change between runs makes a green check
# meaningless. Codecov reports through commit statuses (codecov/project,
# codecov/patch), never a check run.
# ============================================================================

name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write  # codecov-action v6 authenticates through GitHub OIDC
  contents: read

jobs:
  tests:
    name: pytest + coverage
    runs-on: [self-hosted, Linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -q --cov=scripts --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true